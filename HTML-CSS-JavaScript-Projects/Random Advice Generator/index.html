<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advice Pro - API Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="advice-card">
      <header>
        <h1>Wise Advice💡</h1>
      </header>

      <main>
        <div class="advice-display">
          <p id="advice-text">"Click the button to get some wisdom..."</p>
          <button id="copy-btn" title="Copy Advice">Copy</button>
        </div>
      </main>

      <footer>
        <button id="new-advice-btn" class="main-btn">Get New Advice</button>
        <div id="status-msg"></div>
      </footer>
    </div>

    <script src="main.js"></script>
  </body>
</html>
